<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>एडमिन लॉगिन (Admin Portal Login) | Chhote Lal Property Dealer</title>
  <meta name="robots" content="noindex, nofollow">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/svg+xml" href="../images/logo.svg">
  
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body style="background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy-primary) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">

  <div class="form-card" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-lg); border-color: rgba(255,255,255,0.1);">
    
    <div style="text-align: center; margin-bottom: 28px;">
      <a href="../index.html" class="brand-logo" style="justify-content: center; margin-bottom: 12px;">
        <img src="../images/logo.svg" alt="Logo" class="logo-icon-svg" style="width:48px; height:48px;">
      </a>
      <h1 style="font-size: 1.45rem; font-weight: 800; color: var(--navy-primary); margin-bottom: 4px;">
        एडमिन पोर्टल (Admin Login)
      </h1>
      <p style="font-size: 0.85rem; color: var(--text-muted);">
        Chhote Lal Property Dealer • अधिकृत उपयोग हेतु
      </p>
    </div>

    <div id="login-alert" class="feedback-banner" style="display:none;"></div>

    <form id="admin-login-form">
      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label" for="admin-email">ईमेल या उपयोगकर्ता नाम</label>
        <input type="text" id="admin-email" class="form-control" required placeholder="admin" autofocus>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="admin-password">पासवर्ड (Password)</label>
        <input type="password" id="admin-password" class="form-control" required placeholder="••••••••">
      </div>

      <button type="submit" id="login-submit-btn" class="btn btn-gold btn-lg" style="width: 100%; margin-bottom: 16px;">
        लॉगिन करें (Sign In)
      </button>

      <div style="text-align: center;">
        <a href="../index.html" style="font-size: 0.85rem; color: var(--text-muted); text-decoration: underline;">
          &larr; मुख्य वेबसाइट पर वापस जाएं
        </a>
      </div>
    </form>

    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-grey); font-size: 0.78rem; color: var(--text-muted); text-align: center;">
      सुरक्षित एडमिन सत्र • अनधिकृत पहुंच प्रतिबंधित है
    </div>

  </div>

  <script src="../js/config.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
